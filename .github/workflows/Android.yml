name: Android Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Manage Files for Android Compatibility
        run: |
          echo "Ensuring files are correctly placed for Android build..."
          
          # Example: Move assets to the correct directory
          if [ -d "assets" ]; then
            mkdir -p app/src/main/assets
            mv assets/* app/src/main/assets/ || true
          fi
          
          # Example: Rename or modify config files for Android compatibility
          if [ -f "config.json" ]; then
            mv config.json app/src/main/assets/config.json
          fi
          
          # Ensure executable scripts are properly set
          chmod +x gradlew
          
          echo "File management complete."

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YARG-Mobile-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.10.6{{ github.run_number }}
          name: "YARG Mobile Release v0.10.6{{ github.run_number }}"
          draft: false
          prerelease: false
          body: "Automated release of YARG Mobile."
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          
