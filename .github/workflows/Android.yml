name: Build and Release Unity APK

on:
  push:
    branches:
      - android  # Triggers only when pushing to 'android' branch

jobs:
  build-and-release:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Library Folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ github.sha }}
          restore-keys: |
            Library-Android-

      - name: Setup Unity
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: 2022.3.8f1  # Change this to match the YARG Unity version
          targetPlatform: Android

      - name: Activate Unity License
        uses: game-ci/unity-activate@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      - name: Build APK
        run: |
          mkdir -p Build/Android
          unity-editor -batchmode -quit -logFile build.log -projectPath . -executeMethod BuildScript.BuildAndroid

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YARG-Android
          path: Build/Android/*.apk

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          release_name: "YARG Android Release v1.0.${{ github.run_number }}"
          draft: false
          prerelease: false
          files: Build/Android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
